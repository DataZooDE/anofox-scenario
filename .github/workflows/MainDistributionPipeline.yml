#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
# One source tree builds against DuckDB v2.0.1 (the ./duckdb submodule pin,
# community-extensions `repo.ref`) and v1.5.6 (`repo.variegata`). API
# differences sit behind duckdb-compat and src/include/catalog/scenario_compat.hpp,
# see docs/UPDATING.md. DuckDB 1.4.x is not supported. Each line deploys under
# its own <name>/<version>/<duckdb version>/ path on S3.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Build for DuckDB v1.5.6 (latest stable)
  duckdb-v1_5_5-build:
    name: Build extension (DuckDB v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_scenario
      artifact_postfix: _v1.5.6
      exclude_archs: windows_amd64_mingw

  # Build for DuckDB v2.0.1 (cyanoptera)
  duckdb-v2_0_1-build:
    name: Build extension (DuckDB v2.0.1)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_scenario
      artifact_postfix: _v2.0.1
      exclude_archs: windows_amd64_mingw
      # Smoke test and deploy need every artifact, incl. macOS, which the
      # reduced PR matrix of v2.0-cyanoptera leaves out.
      reduced_ci_mode: disabled

  duckdb-v2_0_1-smoke-test:
    name: Smoke test (v2.0.1)
    needs: duckdb-v2_0_1-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.1
      extension_name: anofox_scenario
      artifact_postfix: _v2.0.1
      exclude_archs: 'windows_amd64_mingw'

  duckdb-v2_0_1-deploy:
    name: Deploy extension (DuckDB v2.0.1)
    needs: [duckdb-v2_0_1-build, duckdb-v2_0_1-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_scenario
      artifact_postfix: _v2.0.1
      exclude_archs: windows_amd64_mingw
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths only from the tag run (see the v1.5.6 deploy below).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  duckdb-v1_5_5-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v1_5_5-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_scenario
      # Must match the build job, or the download finds no artifact.
      artifact_postfix: _v1.5.6
      exclude_archs: 'windows_amd64_mingw'

  duckdb-v1_5_5-deploy:
    name: Deploy extension (DuckDB v1.5.6)
    needs: [duckdb-v1_5_5-build, duckdb-v1_5_5-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      # The deploy matrix must come from the tools ref the build used: the
      # ./extension-ci-tools submodule is on v2.0-cyanoptera, whose matrix
      # differs (e.g. osx_amd64 is opt-in there).
      ci_tools_version: v1.5-variegata
      extension_name: anofox_scenario
      artifact_postfix: _v1.5.6
      exclude_archs: windows_amd64_mingw
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # DuckLake integration: scenario bases over a versioned lake need the
  # binary ducklake extension, which only works against release builds
  # (see docs/spec/implementation_plan_phase2_4.md, Phase 4 spike findings).
  # The scenario_ducklake_base test is gated by DUCKLAKE_TESTS and skips
  # cleanly in the distribution matrix above.
  ducklake-integration:
    name: DuckLake integration tests (release, linux, DuckDB ${{ matrix.line.duckdb }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        line:
          # The submodule pins (2.0 line). anofox_forecast has no community build for
          # v2.0.1 yet, so its doc blocks run (SKIP-EXTERNAL otherwise) on the v1.5.6
          # line only; add it here once `INSTALL anofox_forecast FROM community` works
          # on v2.0.1.
          # DuckDB 2.0 no longer derives its version from git tags: a source build
          # is v2.0.0-dev<N> (and INSTALL ducklake 404s) unless the version is given.
          - duckdb: v2.0.1
            ci_tools: ''
            version_override: v2.0.1
            # 2.0's unittest points HOME at a per-run sandbox: keep the real one,
            # where the step above installs ducklake (1.5's unittest has no flag)
            unittest_flags: --keep-home
            extensions: ducklake
          - duckdb: v1.5.6
            ci_tools: v1.5-variegata
            version_override: ''
            unittest_flags: ''
            extensions: ducklake,anofox_forecast
    # Pinned to ubuntu-26.04 on purpose: besides the DuckLake tests, this is
    # the job that builds the way a developer does (plain `make release`, no
    # vcpkg, system OpenSSL) on the newest runner image. On 26.04 (OpenSSL
    # 3.5.5) the static libcrypto.pc lists -lz, and FindOpenSSL with
    # OPENSSL_USE_STATIC_LIBS then resolved /usr/lib/x86_64-linux-gnu/libz.a,
    # which is not -fPIC: linking libduckdb.so failed with "relocation
    # R_X86_64_PC32 against `z_errmsg' ... recompile with -fPIC" / "final link
    # failed: bad value". The distribution matrix uses vcpkg's OpenSSL and
    # never sees this, so keep this job off ubuntu-24.04.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Pin DuckDB and extension-ci-tools to the line
        if: ${{ matrix.line.ci_tools != '' }}
        run: |
          git -C duckdb checkout --quiet "${{ matrix.line.duckdb }}"
          git -C extension-ci-tools fetch --quiet origin "${{ matrix.line.ci_tools }}"
          git -C extension-ci-tools checkout --quiet FETCH_HEAD
          git -C duckdb describe --tags

      - name: Install dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ducklake-integration-${{ github.job }}-ubuntu-26.04-${{ matrix.line.duckdb }}

      - name: Build (release)
        env:
          OVERRIDE_GIT_DESCRIBE: ${{ matrix.line.version_override }}
        run: |
          GEN=ninja make release
          ./build/release/duckdb -c "SELECT version()"

      - name: Install ducklake (and anofox_forecast for the doc snippets) for the built version
        run: |
          ./build/release/duckdb -c "INSTALL ducklake; INSTALL parquet;"
          if [[ ",${{ matrix.line.extensions }}," == *,anofox_forecast,* ]]; then
            ./build/release/duckdb -c "INSTALL anofox_forecast FROM community;"
          fi

      - name: Run test suite incl. DuckLake scenarios
        run: DUCKLAKE_TESTS=1 ./build/release/test/unittest ${{ matrix.line.unittest_flags }} "test/sql/*"

      # Every ```sql block in README.md, docs/ and the Claude Code skills, against this
      # build (scripts/check_doc_snippets.py). Blocks run sandboxed (no file access outside
      # a temp dir, locked configuration, no dot-commands); this job has no secrets.
      - name: Doc snippets (README, docs, skills)
        run: python3 scripts/check_doc_snippets.py --with-ext ${{ matrix.line.extensions }}
