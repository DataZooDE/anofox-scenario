#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
# One source tree builds against DuckDB v1.5.6 and the DuckDB 2.0 pre-release
# that duckdb/community-extensions builds `repo.ref` against (API differences
# sit behind duckdb-compat and src/include/catalog/scenario_compat.hpp, see
# docs/UPDATING.md). The v2 scenario-catalog core does not target v1.4 (see
# docs/spec/implementation_plan_phase1.md §4: the catalog surface the
# extension is built on - PlanMergeInto, EntryLookupInfo with at-clauses,
# virtual columns - does not exist in the v1.4 line). The former v1.4.5 LTS
# job was removed together with the legacy v0.1 engine.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Build for DuckDB v1.5.6 (latest stable)
  duckdb-v1_5_5-build:
    name: Build extension (DuckDB v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_scenario
      artifact_postfix: _v1.5.6
      exclude_archs: windows_amd64_mingw

  # Build against DuckDB 2.0: the commit duckdb/community-extensions pins as
  # DUCKDB_LATEST_STABLE (keep the SHA in step with it). Build and test only:
  # no smoke test (there is no stock 2.0 CLI to load the binary into) and no
  # deploy (an alpha build only loads into that exact alpha). Pull requests
  # build linux_amd64 and windows_amd64; run the workflow by hand
  # (workflow_dispatch) for the full matrix incl. macOS.
  duckdb-next-build:
    name: Build extension binaries (v2.0 pre-release)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_scenario
      artifact_postfix: _v2.0
      exclude_archs: windows_amd64_mingw

  duckdb-v1_5_5-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v1_5_5-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_scenario
      # Must match the build job, or the download finds no artifact.
      artifact_postfix: _v1.5.6
      exclude_archs: 'windows_amd64_mingw'

  duckdb-v1_5_5-deploy:
    name: Deploy extension (DuckDB v1.5.6)
    needs: [duckdb-v1_5_5-build, duckdb-v1_5_5-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_scenario
      artifact_postfix: _v1.5.6
      exclude_archs: windows_amd64_mingw
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # DuckLake integration: scenario bases over a versioned lake need the
  # binary ducklake extension, which only works against release builds
  # (see docs/spec/implementation_plan_phase2_4.md, Phase 4 spike findings).
  # The scenario_ducklake_base test is gated by DUCKLAKE_TESTS and skips
  # cleanly in the distribution matrix above.
  ducklake-integration:
    name: DuckLake integration tests (release, linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Install dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ducklake-integration-${{ github.job }}

      - name: Build (release)
        run: GEN=ninja make release

      - name: Install ducklake for the built version
        run: ./build/release/duckdb -c "INSTALL ducklake; INSTALL parquet;"

      - name: Run test suite incl. DuckLake scenarios
        run: DUCKLAKE_TESTS=1 ./build/release/test/unittest "test/sql/*"
