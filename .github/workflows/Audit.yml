#
# Static audits: cheap checks that need no extension build and no secrets.
#
name: Static audits
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles the duckdb-compat headers (syntax only, no build) against the
  # bundled DuckDB with stray headers from another DuckDB version on a later
  # include path, as a system DuckDB package puts them
  # (scripts/check_compat_stray_headers.sh, ported from anofox-forecast#312).
  # CI runners have no system DuckDB, so without it a __has_include probe that
  # finds the wrong tree only breaks on developer machines.
  compat-stray-headers:
    name: duckdb-compat headers with stray DuckDB headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch the bundled DuckDB and duckdb-compat headers
        run: git submodule update --init --depth 1 duckdb duckdb-compat
      - name: Compile the compat headers with stray headers on the include path
        run: scripts/check_compat_stray_headers.sh
